<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #121829;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .poster {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      background-color: #0f172a;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0 6px 0;
      color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-unlock { background-color: #0284c7; color: white; }
    .btn-file { background-color: #eab308; color: black; }
    .btn-library { background-color: #334155; color: white; }
    
    .library-container {
      display: none;
      text-align: left;
    }
    .movie-item {
      background: #334155;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="title" id="movie-title">🍿 Movie Hub</div>
    <img id="movie-poster" class="poster" src="" alt="Movie Poster" />
    
    <button class="btn btn-unlock" id="unlock-btn" onclick="unlockMovie()">🔓 Unlock Movie</button>
    <button class="btn btn-file" id="get-file-btn" onclick="getFile()" disabled>🔑 Get Movie File</button>
    <button class="btn btn-library" onclick="showLibrary()">📚 View Full Library</button>
  </div>

  <div class="card library-container" id="library-card">
    <div class="title">📚 All Movies</div>
    <div id="movies-list"></div>
    <button class="btn btn-library" style="margin-top:12px;" onclick="hideLibrary()">⬅️ Back</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    let isUnlocked = false;

    async function loadMovie() {
      if (!movieId) {
        showLibrary();
        return;
      }
      try {
        const res = await fetch(/api/movie/${movieId});
        const data = await res.json();
        
        document.getElementById('movie-title').innerText = data.title || 'Movie Hub';
        
        if (data.photo_file_id) {
          document.getElementById('movie-poster').src = /poster/${data.photo_file_id};
        } else {
          document.getElementById('movie-poster').src = 'https://via.placeholder.com/300x450?text=No+Poster';
        }
      } catch (err) {
        console.error('Error loading movie:', err);
      }
    }

    function unlockMovie() {
      isUnlocked = true;
      document.getElementById('get-file-btn').disabled = false;
      document.getElementById('unlock-btn').innerText = "Unlocked!";
      document.getElementById('unlock-btn').style.backgroundColor = "#16a34a";
      alert("Movie unlocked!");
    }

    function getFile() {
      if (!isUnlocked) {
        alert("Please unlock the movie first!");
        return;
      }
      tg.sendData(JSON.stringify({ action: "get_file", movieId: movieId }));
      tg.close();
    }

    async function showLibrary() {
      document.getElementById('main-card').style.display = 'none';
      document.getElementById('library-card').style.display = 'block';
      
      try {
        const res = await fetch('/api/movies');
        const movies = await res.json();
        const listDiv = document.getElementById('movies-list');
        listDiv.innerHTML = '';
        
        if (movies.length === 0) {
          listDiv.innerHTML = '<div style="color:#aaa; text-align:center;">No movies added yet.</div>';
          return;
        }

        movies.forEach(movie => {
          const div = document.createElement('div');
          div.className = 'movie-item';
          div.innerText = movie.title || 'Untitled Movie';
          div.onclick = () => {
            window.location.search = ?id=${movie._id};
          };
          listDiv.appendChild(div);
        });
      } catch (err) {
        console.error('Error loading library:', err);
      }
    }

    function hideLibrary() {
      document.getElementById('library-card').style.display = 'none';
      document.getElementById('main-card').style.display = 'block';
    }

    loadMovie();
  </script>
</body>
</html>
