<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie File Unlocker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h2 { margin-bottom: 10px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .ad-btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .ad-btn.completed { background: #22c55e; cursor: not-allowed; }
    .unlock-btn {
      width: 100%;
      background: #eab308;
      color: #000;
      border: none;
      padding: 16px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .unlock-btn.active {
      opacity: 1;
      cursor: pointer;
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🔒 Link Locked</h2>
  <p id="subtext">Complete the step(s) to unlock your movie file.</p>

  <div id="buttonsContainer"></div>

  <button class="unlock-btn" id="unlockBtn" disabled onclick="getMovieFile()">🔒 Get Movie File</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  const urlParams = new URLSearchParams(window.location.search);
  const fileKey = urlParams.get('start');
  
  // URL से पता करेगा कि कितने Ads दिखाने हैं (डिफ़ॉल्ट 1)
  const totalAds = parseInt(urlParams.get('ads')) || 1; 

  const container = document.getElementById('buttonsContainer');

  // Ads के बटन जनरेट करना
  for (let i = 1; i <= totalAds; i++) {
    const btn = document.createElement('button');
    btn.className = 'ad-btn';
    btn.id = ad${i};
    btn.innerText = Watch Ad ${i} (${i-1}/${totalAds});
    if (i > 1) btn.style.display = 'none';
    btn.onclick = () => watchAd(i);
    container.appendChild(btn);
  }

  function watchAd(adNum) {
    // यहाँ अपना Adsterra / Monetag Direct Link डालें
    const adUrl = "https://www.google.com"; 

    window.open(adUrl, '_blank');

    setTimeout(() => {
      const btn = document.getElementById(ad${adNum});
      btn.classList.add('completed');
      btn.innerText = ✅ Ad ${adNum} Done;
      btn.disabled = true;

      if (adNum < totalAds) {
        document.getElementById(ad${adNum + 1}).style.display = 'block';
      } else {
        const unlockBtn = document.getElementById('unlockBtn');
        unlockBtn.disabled = false;
        unlockBtn.classList.add('active');
        unlockBtn.innerText = '🔓 Get Movie File Now';
      }
    }, 2000);
  }

  function getMovieFile() {
    if (fileKey) {
      tg.sendData(fileKey);
      tg.close();
    }
  }
</script>

</body>
</html>
