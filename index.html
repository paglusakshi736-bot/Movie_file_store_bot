<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Library</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background-color: #0f172a; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .card { background-color: #1e293b; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header-box { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
    .app-logo { width: 38px; height: 38px; border-radius: 8px; }
    h2 { margin: 0; color: #38bdf8; font-size: 20px; }
    .search-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; margin-bottom: 15px; box-sizing: border-box; }
    .poster { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: block; text-decoration: none; text-align: center; }
    .btn-ad { background-color: #3b82f6; color: white; }
    .btn-unlock { background-color: #eab308; color: #000; opacity: 0.5; pointer-events: none; }
    .btn-unlock.active { background-color: #22c55e; color: white; opacity: 1; pointer-events: auto; }
    .movie-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .movie-item img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-box">
      <img src="https://cdn-icons-png.flaticon.com/512/3163/3163478.png" class="app-logo">
      <h2 id="appTitle">Movie Hub</h2>
    </div>

    <div id="unlockView">
      <img id="moviePoster" class="poster" src="">
      <h3 id="movieTitle" style="color:#f8fafc;"></h3>
      <button id="adBtn" class="btn btn-ad" onclick="watchAd()">📺 Watch Ad to Unlock</button>
      <a id="unlockBtn" class="btn btn-unlock" href="#" onclick="setTimeout(()=>{tg.close()}, 1000)">🔑 Get Movie File</a>
      <button class="btn" style="background:#334155;" onclick="showLibrary()">📚 View Full Library</button>
    </div>

    <div id="libraryView" class="hidden">
      <input type="text" id="searchBar" class="search-input" placeholder="🔍 Search movies..." onkeyup="filterMovies()">
      <div id="movieList"><p style="text-align:center;">Loading Library...</p></div>
      <button class="btn" style="background:#334155;" onclick="showUnlockView()">⬅ Back</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    
    // आपका असली Render URL यहाँ सेट कर दिया गया है
    const RENDER_BOT_URL = "https://movie-file-store-bot-13yh.onrender.com";

    const params = new URLSearchParams(window.location.search);
    if (params.get('start')) {
      document.getElementById('movieTitle').innerText = decodeURIComponent(params.get('title') || "Movie File");
      document.getElementById('moviePoster').src = decodeURIComponent(params.get('poster') || "");
    } else {
      showLibrary();
    }

    function watchAd() {
      window.open("https://www.google.com", '_blank');
      document.getElementById('adBtn').innerText = "✅ Ad Completed";
      document.getElementById('adBtn').style.backgroundColor = "#10b981";
      document.getElementById('unlockBtn').href = "https://t.me/" + params.get('bot') + "?start=" + params.get('start');
      document.getElementById('unlockBtn').classList.add('active');
    }

    function showUnlockView() {
      document.getElementById('libraryView').classList.add('hidden');
      document.getElementById('unlockView').classList.remove('hidden');
      document.getElementById('appTitle').innerText = "Movie Hub";
    }
    async function showLibrary() {
      document.getElementById('unlockView').classList.add('hidden');
      document.getElementById('libraryView').classList.remove('hidden');
      document.getElementById('appTitle').innerText = "Movie Library";
      try {
        const res = await fetch(RENDER_BOT_URL + "/api/movies");
        window.allMovies = await res.json();
        render(window.allMovies);
      } catch (e) { document.getElementById('movieList').innerHTML = "Failed to load library."; }
    }

    function render(m) {
      document.getElementById('movieList').innerHTML = m.map(x => 
        <div class="movie-item" onclick="location.href='/?start=${x.id}&bot=${params.get('bot')}&title=${encodeURIComponent(x.title)}&poster=${encodeURIComponent(x.poster)}'">
          <img src="${x.poster}"><div><b>${x.title}</b></div>
        </div>).join('');
    }

    function filterMovies() {
      const q = document.getElementById('searchBar').value.toLowerCase();
      render(allMovies.filter(x => x.title.toLowerCase().includes(q)));
    }
  </script>
</body>
</html>
