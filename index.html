<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Unlocker Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }
    .btn-ad { background-color: #3b82f6; color: white; }
    .btn-unlock {
      background-color: #eab308;
      color: #000000;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .btn-unlock.active {
      background-color: #22c55e;
      color: white;
      cursor: pointer;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 Link Locked</h2>
    <p>Watch ad step(s) below to unlock your movie file.</p>

    <button id="adBtn" class="btn btn-ad" onclick="watchAd()">📺 Watch Ad to Unlock</button>
    <button id="unlockBtn" class="btn btn-unlock" disabled onclick="sendDataBack()">🔑 Get Movie File</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const fileKey = urlParams.get('start') || '';
    
    const adUrl = "https://www.google.com"; 

    function watchAd() {
      window.open(adUrl, '_blank');

      const adBtn = document.getElementById('adBtn');
      const unlockBtn = document.getElementById('unlockBtn');

      adBtn.innerText = "✅ Ad Completed";
      adBtn.style.backgroundColor = "#10b981";
      adBtn.disabled = true;

      unlockBtn.disabled = false;
      unlockBtn.classList.add('active');
    }

    function sendDataBack() {
      if (fileKey) {
        tg.sendData(fileKey);
        tg.close(); // Send Data करने के बाद Mini App को ऑटो-क्लोज करना
      } else {
        alert("File key missing!");
      }
    }
  </script>
</body>
</html>
