<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Hub Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .poster {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      background-color: #334155;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin: 14px 0 10px 0;
      color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-unlock { background-color: #0284c7; color: white; }
    .btn-file { background-color: #eab308; color: black; }
    .btn-file:disabled { background-color: #475569; color: #94a3b8; cursor: not-allowed; }
    .btn-library { background-color: #334155; color: white; }

    /* Library Screen CSS */
    .library-container {
      display: none;
      text-align: left;
    }
    .movie-list {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .movie-item {
      background: #334155;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      cursor: pointer;
      color: #ffffff;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .movie-item:hover { background: #475569; }
  </style>
</head>
<body>

  <!-- Screen 1: Single Movie View -->
  <div class="card" id="main-card">
    <div class="title" id="movie-title">🍿 Movie Hub</div>
    <img id="movie-poster" class="poster" src="https://via.placeholder.com/300x450?text=Loading+Poster..." alt="Movie Poster" />
    
    <button class="btn btn-unlock" id="unlock-btn" onclick="unlockMovie()">🔓 Unlock Movie</button>
    <button class="btn btn-file" id="get-file-btn" onclick="getFile()" disabled>🔑 Get Movie File</button>
    <button class="btn btn-library" onclick="showLibrary()">📚 View Full Library</button>
  </div>

  <!-- Screen 2: All Movies Library View -->
  <div class="card library-container" id="library-card">
    <div class="title">📚 All Available Movies</div>
    <div class="movie-list" id="movies-list">Loading movies...</div>
    <button class="btn btn-library" style="margin-top: 14px;" onclick="hideLibrary()">⬅️ Back to Single View</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');

    let isUnlocked = false;

    // Movie data load karne ka function
    async function loadMovie() {
      if (!movieId) {
        showLibrary();
        return;
      }
      try {
        const res = await fetch(/api/movie/${movieId});
        if (!res.ok) throw new Error('Movie not found');
        const data = await res.json();
        
        document.getElementById('movie-title').innerText = data.title || 'Movie Hub';
        if (data.poster_url) {
          document.getElementById('movie-poster').src = data.poster_url;
        } else {
          document.getElementById('movie-poster').src = 'https://via.placeholder.com/300x450?text=No+Poster';
        }
      } catch (err) {
        console.error('Error loading movie:', err);
        showLibrary();
      }
    }
    // Unlock Button Function
    function unlockMovie() {
      isUnlocked = true;
      const getBtn = document.getElementById('get-file-btn');
      const unlockBtn = document.getElementById('unlock-btn');
      
      getBtn.disabled = false;
      unlockBtn.innerText = "✅ Unlocked!";
      unlockBtn.style.backgroundColor = "#16a34a";
      alert("Movie Unlocked Successfully! Click 'Get Movie File'.");
    }

    // Send File to Bot Function
    function getFile() {
      if (!isUnlocked) {
        alert("Please click 'Unlock Movie' first!");
        return;
      }
      tg.sendData(JSON.stringify({ action: "get_file", movieId: movieId }));
      tg.close();
    }

    // Show Library Function
    async function showLibrary() {
      document.getElementById('main-card').style.display = 'none';
      document.getElementById('library-card').style.display = 'block';
      
      const listDiv = document.getElementById('movies-list');
      listDiv.innerHTML = 'Loading library...';

      try {
        const res = await fetch('/api/movies');
        const movies = await res.json();
        listDiv.innerHTML = '';
        
        if (!movies || movies.length === 0) {
          listDiv.innerHTML = '<div style="color:#aaa; text-align:center; padding: 20px;">No movies found in database.</div>';
          return;
        }

        movies.forEach(movie => {
          const div = document.createElement('div');
          div.className = 'movie-item';
          div.innerHTML = 🎬 <span>${movie.title || 'Untitled Movie'}</span>;
          div.onclick = () => {
            window.location.search = ?id=${movie._id};
          };
          listDiv.appendChild(div);
        });
      } catch (err) {
        console.error('Error loading library:', err);
        listDiv.innerHTML = '<div style="color:#ef4444; text-align:center; padding: 20px;">Failed to load movies.</div>';
      }
    }

    // Back from Library
    function hideLibrary() {
      document.getElementById('library-card').style.display = 'none';
      document.getElementById('main-card').style.display = 'block';
    }

    loadMovie();
  </script>
</body>
</html>
